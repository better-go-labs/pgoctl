version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      # CLI tools intentionally accept user-supplied file paths; G304 is expected behaviour
      - linters: [gosec]
        text: "G304:"
      # Unix 0755/0644 permissions are standard for CLI tools and test fixtures
      - linters: [gosec]
        text: "G301:"
      - linters: [gosec]
        text: "G306:"
      # exec.Command with a variable is standard Go test practice
      - linters: [gosec]
        path: "_test\\.go"
        text: "G204:"
      # leverage-check runs the fixed "go" binary without a shell; only the package pattern varies
      - linters: [gosec]
        path: "internal/leverage/"
        text: "G204:"
      # tests and benchmarks read fixture paths from env vars they control
      - linters: [gosec]
        path: "_test\\.go"
        text: "G703:"
      # loadgen uses math/rand for synthetic metric noise; crypto-safe random is not needed
      - linters: [gosec]
        path: "hack/loadgen/"
        text: "G404:"

formatters:
  enable:
    - gofmt
    - goimports
