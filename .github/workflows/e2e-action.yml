# NOTE: The pr-comment job requires pull-requests:write. Fork PRs will get a
# 403 on the comment step — this is expected; document it as a known limitation.
name: e2e / pgo-action

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/e2e-action.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly; reserved for deferred parca + dawidd6 jobs

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  # ── Job 1: fixture-pipeline ───────────────────────────────────────────────────────
  # Covers: A (profile-file input), B (compare/verdict neutral), E (previous-profile merge).
  # Generates real pprof at runtime via a short pprof server collect (LFS files have no content).
  fixture-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          check-latest: true

      - name: Build pgoctl and generate fixture profile
        run: |
          go build -o /tmp/pgoctl ./cmd/pgoctl
          echo /tmp >> "$GITHUB_PATH"

          # Spin up a pprof server with real CPU load to generate a rich profile.
          cat > /tmp/pprof_gen.go << 'EOF'
          package main
          import (
            "net/http"
            _ "net/http/pprof"
            "runtime"
          )
          func main() {
            for i := 0; i < runtime.NumCPU(); i++ {
              go func() {
                x := uint64(0)
                for { x++ }
              }()
            }
            http.ListenAndServe(":6060", nil)
          }
          EOF
          go run /tmp/pprof_gen.go &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:6060/debug/pprof/ >/dev/null 2>&1; then
              echo "pprof server ready after ${i}s"
              break
            fi
            [ "$i" -eq 15 ] && { echo "pprof server did not become ready"; exit 1; }
            sleep 1
          done

          mkdir -p testdata/fixtures
          /tmp/pgoctl collect \
            --source=pprof \
            --url=http://localhost:6060/debug/pprof/profile \
            --window=10s \
            --out=testdata/fixtures/cpu.pprof

          # cpu-prev: same profile → neutral verdict (0% delta vs baseline)
          cp testdata/fixtures/cpu.pprof testdata/fixtures/cpu-prev.pprof

          # baseline.pgo from a single-profile merge
          /tmp/pgoctl merge testdata/fixtures/cpu.pprof --out=testdata/fixtures/baseline.pgo

      - id: run
        uses: ./
        with:
          profile-file: testdata/fixtures/cpu.pprof
          baseline-profile: testdata/fixtures/baseline.pgo
          previous-profile: testdata/fixtures/cpu-prev.pprof
          profile-store: artifact
          upload-artifact: 'true'
          comment-on-pr: 'false'
          artifact-name: pgo-e2e-fixture
          on-gate-failure: warn

      - name: assert outputs
        run: |
          test -n "${{ steps.run.outputs.verdict }}"        || { echo "empty verdict"; exit 1; }
          test -n "${{ steps.run.outputs.validate-score }}" || { echo "empty score"; exit 1; }
          case "${{ steps.run.outputs.verdict }}" in
            promote|neutral|rollback) ;;
            *) echo "unexpected verdict: ${{ steps.run.outputs.verdict }}"; exit 1;;
          esac
          [ "${{ steps.run.outputs.verdict }}" = "neutral" ] || \
            { echo "expected neutral, got: ${{ steps.run.outputs.verdict }}"; exit 1; }
          test -s "${{ steps.run.outputs.profile-path }}"
          test -s "${{ steps.run.outputs.artifact-path }}"
          test -n "${{ steps.run.outputs.explain-top-functions }}" || { echo "empty explain output"; exit 1; }

  # ── Job 2: artifact-roundtrip ─────────────────────────────────────────────────
  # Covers: D (a failed gate uploads nothing).
  # The fixture profile fails the quality gate, and a failed gate skips the artifact
  # upload, so the download must fail: this job asserts there is no artifact to fetch.
  artifact-roundtrip:
    needs: fixture-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: pgo-e2e-fixture
          path: dl
      - run: test "${{ steps.dl.outcome }}" = "failure" || { echo "a failed gate must not upload the artifact"; exit 1; }

  # ── Job 3: pr-comment ────────────────────────────────────────────────────────
  # Covers: C (PR comment idempotency). Pull-request only.
  # Runs the action twice; asserts exactly 1 comment with the action marker exists.
  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # required for checkout
      pull-requests: write  # required for PR comments
      actions: write        # required for the artifact profile store
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          check-latest: true

      - name: Build pgoctl and generate fixture profile
        run: |
          go build -o /tmp/pgoctl ./cmd/pgoctl
          echo /tmp >> "$GITHUB_PATH"

          cat > /tmp/pprof_gen.go << 'EOF'
          package main
          import (
            "net/http"
            _ "net/http/pprof"
            "runtime"
          )
          func main() {
            for i := 0; i < runtime.NumCPU(); i++ {
              go func() {
                x := uint64(0)
                for { x++ }
              }()
            }
            http.ListenAndServe(":6060", nil)
          }
          EOF
          go run /tmp/pprof_gen.go &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:6060/debug/pprof/ >/dev/null 2>&1; then break; fi
            [ "$i" -eq 15 ] && { echo "pprof server not ready"; exit 1; }
            sleep 1
          done

          mkdir -p testdata/fixtures
          /tmp/pgoctl collect \
            --source=pprof \
            --url=http://localhost:6060/debug/pprof/profile \
            --window=10s \
            --out=testdata/fixtures/cpu.pprof

      - id: run1
        uses: ./
        with:
          profile-file: testdata/fixtures/cpu.pprof
          profile-store: artifact
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: 'false'
          on-gate-failure: warn

      - id: run2
        uses: ./
        with:
          profile-file: testdata/fixtures/cpu.pprof
          profile-store: artifact
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: 'false'
          on-gate-failure: warn

      - name: assert comment idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '[.[] | select(.body | contains("<!-- pgo-action-comment -->"))] | length')
          [ "$count" -eq 1 ] || { echo "Expected 1 comment, got $count"; exit 1; }

  # ── Job 4: pprof-collect ────────────────────────────────────────────────────────
  # Covers: G (live pprof collect wiring inside the composite action).
  # Starts a CPU-burning pprof server, runs the action via pprof-url, asserts
  # the resulting profile is non-empty.
  pprof-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          check-latest: true

      - name: Start pprof server (CPU burner)
        run: |
          cat > /tmp/pprof_server.go << 'EOF'
          package main
          import (
            "net/http"
            _ "net/http/pprof"
            "runtime"
          )
          func main() {
            for i := 0; i < runtime.NumCPU(); i++ {
              go func() {
                x := uint64(0)
                for { x++ }
              }()
            }
            http.ListenAndServe(":6060", nil)
          }
          EOF
          go run /tmp/pprof_server.go &
          for i in $(seq 1 10); do
            if curl -sf http://localhost:6060/debug/pprof/ >/dev/null 2>&1; then
              echo "pprof server ready after ${i}s"
              break
            fi
            [ "$i" -eq 10 ] && { echo "pprof server did not become ready"; exit 1; }
            sleep 1
          done

      - id: run
        uses: ./
        with:
          pprof-url: http://localhost:6060
          duration: '10'
          profile-store: artifact
          upload-artifact: 'false'
          comment-on-pr: 'false'
          on-gate-failure: warn

      - name: assert collect output
        run: test -s "${{ steps.run.outputs.profile-path }}"

  # ── Job 5: leverage-probe ────────────────────────────────────────────────────
  # Covers: run-leverage-probe input + leverage-verdict output wired through the
  # composite action. Uses testdata/pgoctl_cpu.pprof (pgoctl itself) and asserts
  # leverage-verdict == NONE: pgoctl has 0 module devirts / 0 module extra inlines.
  leverage-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build pgoctl
        run: |
          go build -o /tmp/pgoctl ./cmd/pgoctl
          echo /tmp >> "$GITHUB_PATH"

      - id: run
        uses: ./
        with:
          profile-file: testdata/pgoctl_cpu.pprof
          run-leverage-probe: 'true'
          leverage-probe-target: ./cmd/pgoctl
          profile-store: artifact
          upload-artifact: 'false'
          comment-on-pr: 'false'

      - name: assert leverage-verdict == NONE
        run: |
          GOT="${{ steps.run.outputs.leverage-verdict }}"
          if [ "$GOT" != "NONE" ]; then
            echo "::error::Expected leverage-verdict=NONE for pgoctl itself, got: ${GOT}"
            exit 1
          fi
          echo "leverage-verdict=NONE confirmed (pgoctl has 0 module devirts / 0 module extra inlines)"

  # ── Job 6: profile-file-in-workspace ─────────────────────────────────────────
  # Covers: a profile-file already named cpu.pprof in the workspace root must be
  # accepted. Regression test for the Collect step copying the profile onto itself.
  profile-file-in-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Put the profile at cpu.pprof in the workspace root
        run: cp testdata/pgoctl_cpu.pprof ./cpu.pprof

      - id: run
        uses: ./
        with:
          profile-file: cpu.pprof
          profile-store: artifact
          upload-artifact: 'false'
          comment-on-pr: 'false'
          on-gate-failure: warn

      - name: assert validate-score is populated
        run: test -n "${{ steps.run.outputs.validate-score }}" || { echo "empty validate-score"; exit 1; }

  # ── Job 7: missing-source-fails-hard ─────────────────────────────────────────
  # Covers: plan Task 10 step 3. Collect mode with no source (no pprof-url, no
  # parca-url, no profile-file) must fail the action hard, not continue as a soft
  # gate failure. continue-on-error lets us read the step outcome and assert failure.
  missing-source-fails-hard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - id: run
        uses: ./
        continue-on-error: true
        with:
          profile-store: artifact
          upload-artifact: 'false'
          comment-on-pr: 'false'

      - name: assert the action step failed
        run: test "${{ steps.run.outcome }}" = "failure" || { echo "expected the action to fail hard on missing source"; exit 1; }
