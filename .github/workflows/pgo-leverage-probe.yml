name: PGO Leverage Probe
# Statically evaluates whether a Go repo can benefit from PGO BEFORE running
# any full benchmark cycle. Probes the two primary PGO codegen levers:
#   1. Profile-guided INLINING  — go build -gcflags=-m=2 WITH vs WITHOUT profile
#   2. DEVIRTUALIZATION         — PGO-driven devirt markers in the same diff
# Emits: PGO-leverage = NONE | LOW | HIGH
#
# Two jobs prove correctness on known targets:
#   probe-high     : Prometheus (interface-dispatch-heavy) → expect HIGH
#   probe-none-low : nats-server (client.parse over inline budget) → expect NONE/LOW

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pgo-leverage-probe.yml'
      - 'scripts/pgo-leverage/**'
      - 'action.yml'

concurrency:
  group: pgo-leverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  # ── Job 1: PGO-friendly target (Prometheus) ──────────────────────────────
  probe-high:
    name: "Leverage probe — Prometheus (expect: HIGH)"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pgoctl
        run: go build -o /tmp/pgoctl ./cmd/pgoctl

      # -------- Positive control: verify the probe mechanism works -----------
      - name: "Ctrl | Run positive-control benchmark (interface dispatch, 15s)"
        working-directory: scripts/pgo-leverage/positive-control
        run: |
          go test -bench=BenchmarkControl -benchtime=15s -cpuprofile=/tmp/ctrl.pprof .
          ls -lh /tmp/ctrl.pprof

      - name: "Ctrl | Check leverage (--dir)"
        working-directory: scripts/pgo-leverage/positive-control
        run: |
          /tmp/pgoctl leverage-check --dir . --format json /tmp/ctrl.pprof > /tmp/ctrl-leverage.json
          cat /tmp/ctrl-leverage.json

      - name: "Ctrl | Report"
        env:
          TARGET_NAME: "positive-control (interface dispatch)"
          LEVERAGE_JSON: /tmp/ctrl-leverage.json
          REPORT_OUT: /tmp/ctrl-report.md
        run: python3 scripts/pgo-leverage/report.py

      - name: "Ctrl | Job summary"
        run: |
          {
            echo "## Positive Control"
            cat /tmp/ctrl-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # -------- Main probe: Prometheus -------------------------------------
      - name: "Prometheus | Checkout"
        uses: actions/checkout@v7
        with:
          repository: prometheus/prometheus
          path: _prometheus
          fetch-depth: 1

      - name: "Prometheus | Cache Go modules"
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: prom-mod-${{ hashFiles('_prometheus/go.sum') }}
          restore-keys: prom-mod-

      - name: "Prometheus | Validate + merge profile"
        run: |
          if [ -f testdata/prometheus_cpu.pprof ]; then
            /tmp/pgoctl merge --strategy weighted --out /tmp/prometheus.pgo testdata/prometheus_cpu.pprof
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "PGO_FILE=/tmp/prometheus.pgo" >> "$GITHUB_ENV"
            echo "Profile: $(du -sh /tmp/prometheus.pgo | cut -f1)"
          else
            echo "HAS_PROFILE=false" >> "$GITHUB_ENV"
            echo "::warning::testdata/prometheus_cpu.pprof not found — probe will run baseline-only"
          fi

      - name: "Prometheus | Download deps"
        working-directory: _prometheus
        run: go mod download

      - name: "Prometheus | Check leverage"
        working-directory: _prometheus
        run: |
          if [ "$HAS_PROFILE" = "true" ]; then
            /tmp/pgoctl leverage-check --dir . --format json "$PGO_FILE" > /tmp/prom-leverage.json
          else
            /tmp/pgoctl leverage-check --format json ./... > /tmp/prom-leverage.json || echo "{\"verdict\": \"INCOMPLETE\"}" > /tmp/prom-leverage.json
          fi
          cat /tmp/prom-leverage.json

      - name: "Prometheus | Generate leverage report"
        env:
          TARGET_NAME: "prometheus/prometheus"
          LEVERAGE_JSON: /tmp/prom-leverage.json
          REPORT_OUT: /tmp/prom-leverage-report.md
        run: python3 scripts/pgo-leverage/report.py

      - name: "Prometheus | Job summary"
        run: |
          {
            echo ""
            echo "---"
            echo "## Prometheus Leverage Probe"
            cat /tmp/prom-leverage-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Prometheus | Sticky PR comment"
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pgo-leverage-prometheus
          path: /tmp/prom-leverage-report.md

      - name: Upload probe artifacts (Prometheus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-leverage-probe-prometheus
          path: |
            /tmp/ctrl-report.md
            /tmp/prom-no-pgo.txt
            /tmp/prom-with-pgo.txt
            /tmp/prom-explain.json
            /tmp/prom-leverage-report.md
          if-no-files-found: warn

  # ── Job 2: Known-flat target (nats-server: client.parse over inline budget) ──
  probe-none-low:
    name: "Leverage probe — nats-server (expect: NONE/LOW)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pgoctl
        run: go build -o /tmp/pgoctl ./cmd/pgoctl

      - name: "nats-server | Checkout (public)"
        uses: actions/checkout@v7
        with:
          repository: nats-io/nats-server
          path: _nats-server
          fetch-depth: 1

      # Try to fetch a profile artifact from the better-go-labs fork;
      # gracefully skip if unavailable (cross-repo artifact access may be restricted).
      # Use ?per_page=100 (no --paginate) so the jq filter runs over the full
      # result set; --paginate applies jq per page so `last` would be wrong.
      - name: "nats-server | Fetch PGO profile artifact (if available)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          RUN_ID=$(gh api "/repos/better-go-labs/nats-server/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="default-pgo" and .expired==false)] | sort_by(.created_at) | last | .workflow_run.id' \
            2>/dev/null || echo "")
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && [ "$RUN_ID" != "" ]; then
            gh run download "$RUN_ID" \
              --repo "better-go-labs/nats-server" \
              --name default-pgo \
              --dir /tmp/nats-profile 2>/dev/null || true
          fi
          PGO_FILE=$(find /tmp/nats-profile -type f 2>/dev/null | head -1)
          if [ -n "$PGO_FILE" ]; then
            echo "HAS_PROFILE=true" >> "$GITHUB_ENV"
            echo "NATS_PGO_FILE=$PGO_FILE" >> "$GITHUB_ENV"
            echo "Profile: $PGO_FILE ($(du -sh "$PGO_FILE" | cut -f1))"
          else
            echo "HAS_PROFILE=false" >> "$GITHUB_ENV"
            echo "No nats-server profile artifact available — running baseline-only probe."
            echo "Note: NONE verdict requires a profile. Baseline analysis still reveals inline budget violations."
          fi
          set -e

      - name: "nats-server | Check leverage"
        working-directory: _nats-server
        run: |
          if [ "$HAS_PROFILE" = "true" ]; then
            /tmp/pgoctl leverage-check --dir . --format json "$NATS_PGO_FILE" > /tmp/nats-leverage.json
          else
            /tmp/pgoctl leverage-check --format json . > /tmp/nats-leverage.json || echo "{\"verdict\": \"INCOMPLETE\"}" > /tmp/nats-leverage.json
          fi
          cat /tmp/nats-leverage.json

      - name: "nats-server | Generate leverage report"
        env:
          TARGET_NAME: "nats-io/nats-server"
          LEVERAGE_JSON: /tmp/nats-leverage.json
          REPORT_OUT: /tmp/nats-leverage-report.md
        run: python3 scripts/pgo-leverage/report.py

      - name: "nats-server | Job summary"
        run: |
          {
            echo "## nats-server Leverage Probe"
            cat /tmp/nats-leverage-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "nats-server | Sticky PR comment"
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pgo-leverage-nats
          path: /tmp/nats-leverage-report.md

      - name: Upload probe artifacts (nats-server)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-leverage-probe-nats-server
          path: |
            /tmp/nats-no-pgo.txt
            /tmp/nats-with-pgo.txt
            /tmp/nats-explain.json
            /tmp/nats-leverage-report.md
          if-no-files-found: warn
