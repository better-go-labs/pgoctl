name: PGO Benchmark
# D4/D5 signal: proves PGO before/after on Prometheus.
# Uses 10 interleaved rounds on the SAME runner to eliminate cross-job variance.
# Requires testdata/prometheus_cpu.pprof (from profile-collect workflow).
# Posts benchstat p-value output to job summary and sticky PR comment.
# Benchmarked packages are derived from pgoctl validate --json package_shares, not guessed.
# Current profile (2026-08-10): tsdb 15.92%, promql 15.17%, storage 6.38%,
#   tsdb/chunkenc 4.59%, model/labels 3.28%, util/annotations 0.74% (no benchmarks).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'testdata/*.pprof'
      - '.github/workflows/pgo-bench.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check for pprof profile
        id: profile
        run: |
          if [ -f testdata/prometheus_cpu.pprof ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Profile found: testdata/prometheus_cpu.pprof"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::testdata/prometheus_cpu.pprof not found — run profile-collect workflow first."
          fi

      - name: Skip if no profile
        if: steps.profile.outputs.found != 'true'
        run: |
          echo "## PGO Benchmark: skipped" >> $GITHUB_STEP_SUMMARY
          echo "No \`testdata/prometheus_cpu.pprof\` present. Run the *Profile Collect* workflow, " \
               "then commit the artifact to \`testdata/\` and re-trigger." >> $GITHUB_STEP_SUMMARY

      - name: Build pgoctl binary
        if: steps.profile.outputs.found == 'true'
        run: |
          go build -o /tmp/pgoctl ./cmd/pgoctl

      - name: Validate + generate default.pgo
        if: steps.profile.outputs.found == 'true'
        run: |
          /tmp/pgoctl validate \
            --min-samples 1000 --min-score 0.3 \
            testdata/prometheus_cpu.pprof
          /tmp/pgoctl merge \
            --strategy weighted --out /tmp/default.pgo \
            testdata/prometheus_cpu.pprof
          echo "Generated /tmp/default.pgo"
          echo "=== Package shares (from pgoctl validate --json) ==="
          /tmp/pgoctl validate \
            --min-samples 1000 --min-score 0.3 \
            --min-package-share "github.com/prometheus/prometheus/tsdb:0.1" \
            --min-package-share "github.com/prometheus/prometheus/promql:0.1" \
            --min-package-share "github.com/prometheus/prometheus/storage:0.1" \
            --min-package-share "github.com/prometheus/prometheus/tsdb/chunkenc:0.1" \
            --min-package-share "github.com/prometheus/prometheus/model/labels:0.1" \
            --min-package-share "github.com/prometheus/prometheus/util/annotations:0.1" \
            --json \
            testdata/prometheus_cpu.pprof > /tmp/validate-shares.json 2>&1 || true
          cat /tmp/validate-shares.json

      - name: Checkout Prometheus
        if: steps.profile.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: prometheus/prometheus
          path: _prometheus
          fetch-depth: 1

      - name: Cache Go modules (Prometheus)
        if: steps.profile.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: prom-mod-${{ hashFiles('_prometheus/go.sum') }}
          restore-keys: prom-mod-

      - name: Install benchstat
        if: steps.profile.outputs.found == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download Prometheus dependencies
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        run: go mod download

      - name: Pre-compile test binaries per hot package
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        env:
          PGO_PROFILE: /tmp/default.pgo
          GOTOOLCHAIN: local
        run: |
          mkdir -p /tmp/bench
          # Five packages with benchmarks, ordered by profile flat CPU share.
          # tsdb:15.92%  promql:15.17%  storage:6.38%  tsdb/chunkenc:4.59%  model/labels:3.28%
          # Each package gets a baseline binary (no PGO) and a PGO binary compiled once.
          declare -A PKG_PATH
          PKG_PATH[tsdb]="./tsdb"
          PKG_PATH[promql]="./promql"
          PKG_PATH[storage]="./storage"
          PKG_PATH[chunkenc]="./tsdb/chunkenc"
          PKG_PATH[labels]="./model/labels"
          for name in tsdb promql storage chunkenc labels; do
            path="${PKG_PATH[$name]}"
            echo "=== Compiling $name ($path) ==="
            go test -c -o /tmp/bench/${name}-baseline.test "${path}"
            echo "  baseline: $(ls -lh /tmp/bench/${name}-baseline.test)"
            go test -c -pgo="$PGO_PROFILE" -o /tmp/bench/${name}-pgo.test "${path}"
            echo "  pgo:      $(ls -lh /tmp/bench/${name}-pgo.test)"
          done

      - name: Verify benchmarks exist in compiled binaries
        if: steps.profile.outputs.found == 'true'
        run: |
          for name in tsdb promql storage chunkenc labels; do
            echo "=== $name ==="
            /tmp/bench/${name}-baseline.test -test.list='^Benchmark' 2>/dev/null | head -10 || true
          done

      - name: Run 10 interleaved benchmark rounds (baseline vs PGO, all hot packages)
        if: steps.profile.outputs.found == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          export GOMAXPROCS=4
          echo "Go version: $(go version)"
          echo "Profile: /tmp/default.pgo"
          echo ""
          # tsdb has 74 benchmarks; exclude slow compaction/block-open ones that
          # are unrelated to the remote-write+query hot path in the profile.
          TSDB_BENCH='^Benchmark(Head|Query|Querier|WAL|Label|Encode|Decode|Xor|WriteBit|Append|Filter|Chunk|Iter|Create|Load[WL])'
          echo "Running 10 interleaved rounds across 5 packages..."
          for i in $(seq 1 10); do
            echo "=== round $i/10 ==="
            /tmp/bench/tsdb-baseline.test \
              -test.bench="${TSDB_BENCH}" -test.benchtime=500ms -test.benchmem \
              -test.run=^$ >> /tmp/bench/tsdb-baseline.txt 2>/dev/null || true
            /tmp/bench/tsdb-pgo.test \
              -test.bench="${TSDB_BENCH}" -test.benchtime=500ms -test.benchmem \
              -test.run=^$ >> /tmp/bench/tsdb-pgo.txt 2>/dev/null || true
            for name in promql storage chunkenc labels; do
              /tmp/bench/${name}-baseline.test \
                -test.bench=. -test.benchtime=500ms -test.benchmem \
                -test.run=^$ >> /tmp/bench/${name}-baseline.txt 2>/dev/null || true
              /tmp/bench/${name}-pgo.test \
                -test.bench=. -test.benchtime=500ms -test.benchmem \
                -test.run=^$ >> /tmp/bench/${name}-pgo.txt 2>/dev/null || true
            done
          done
          echo "Benchmark rounds complete."
          for name in tsdb promql storage chunkenc labels; do
            echo "${name} baseline lines: $(wc -l < /tmp/bench/${name}-baseline.txt 2>/dev/null || echo 0)"
          done

      - name: Collect CPU profiles from chunkenc workload (for pgoctl compare)
        if: steps.profile.outputs.found == 'true'
        run: |
          # Both profiles from the same workload so pgoctl compare sees hot function deltas.
          /tmp/bench/chunkenc-baseline.test \
            -test.bench=. -test.benchtime=2s -test.benchmem \
            -test.run=^$ -test.cpuprofile=/tmp/baseline-bench.pprof 2>/dev/null || true
          /tmp/bench/chunkenc-pgo.test \
            -test.bench=. -test.benchtime=2s -test.benchmem \
            -test.run=^$ -test.cpuprofile=/tmp/pgo-bench.pprof 2>/dev/null || true
          echo "baseline profile: $(ls -lh /tmp/baseline-bench.pprof 2>/dev/null || echo 'MISSING')"
          echo "pgo profile:      $(ls -lh /tmp/pgo-bench.pprof 2>/dev/null || echo 'MISSING')"

      - name: benchstat comparison + pgoctl compare verdict
        if: steps.profile.outputs.found == 'true'
        id: report
        run: |
          COMPARE_OUT=$(/tmp/pgoctl compare --json \
            /tmp/baseline-bench.pprof /tmp/pgo-bench.pprof 2>&1 || true)

          cat > /tmp/bench-report.md << 'REPORT'
          ## D4/D5 PGO Signal — Prometheus Benchmark

          | | |
          |---|---|
          | Profile (PGO input) | `testdata/prometheus_cpu.pprof` |
          | Rounds | 10 interleaved pairs, same runner |
          | Toolchain | pinned `GOTOOLCHAIN=local` |
          | Method | `go test -c` once per arm, then run .test binary |

          ### Profile Package Shares (`pgoctl validate --json`)

          | Package | Flat CPU% | Benchmarked |
          |---------|-----------|-------------|
          | `./tsdb` | 15.92% | ✅ |
          | `./promql` | 15.17% | ✅ |
          | `./storage` | 6.38% | ✅ |
          | `./tsdb/chunkenc` | 4.59% | ✅ |
          | `./model/labels` | 3.28% | ✅ |
          | `./util/annotations` | 0.74% | ❌ no benchmarks |

          > Shares above are from the profile committed at the time of this run.
          > Re-run profile-collect to refresh if the profile has been updated.

          ### benchstat (geomean + p-value, per package)

          > Threshold: ≥3% geomean improvement (p < 0.05) to promote.

          REPORT

          for name in tsdb promql storage chunkenc labels; do
            echo "#### \`./\${name/chunkenc/tsdb\/chunkenc}\`" >> /tmp/bench-report.md
            echo '```' >> /tmp/bench-report.md
            benchstat /tmp/bench/${name}-baseline.txt /tmp/bench/${name}-pgo.txt \
              >> /tmp/bench-report.md 2>&1 || echo "(no matching benchmarks or insufficient data)" >> /tmp/bench-report.md
            echo '```' >> /tmp/bench-report.md
            echo "" >> /tmp/bench-report.md
          done

          cat >> /tmp/bench-report.md << 'REPORT2'
          ### pgoctl compare verdict (chunkenc baseline → PGO profile)

          ```
          REPORT2
          echo "$COMPARE_OUT" >> /tmp/bench-report.md
          printf '```\n' >> /tmp/bench-report.md

          cat /tmp/bench-report.md >> $GITHUB_STEP_SUMMARY

      - name: Post sticky PR comment
        if: >
          steps.profile.outputs.found == 'true' &&
          github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pgo-bench
          path: /tmp/bench-report.md
