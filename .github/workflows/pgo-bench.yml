name: PGO Benchmark
# D4/D5 signal: proves PGO before/after on Prometheus.
# Uses 10 interleaved rounds on the SAME runner to eliminate cross-job variance.
# Requires testdata/prometheus_cpu.pprof (from profile-collect workflow).
# Posts benchstat p-value output to job summary and sticky PR comment.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'testdata/*.pprof'
      - '.github/workflows/pgo-bench.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check for pprof profile
        id: profile
        run: |
          if [ -f testdata/prometheus_cpu.pprof ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Profile found: testdata/prometheus_cpu.pprof"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::testdata/prometheus_cpu.pprof not found — run profile-collect workflow first."
          fi

      - name: Skip if no profile
        if: steps.profile.outputs.found != 'true'
        run: |
          echo "## PGO Benchmark: skipped" >> $GITHUB_STEP_SUMMARY
          echo "No \`testdata/prometheus_cpu.pprof\` present. Run the *Profile Collect* workflow, " \
               "then commit the artifact to \`testdata/\` and re-trigger." >> $GITHUB_STEP_SUMMARY

      - name: Validate + generate default.pgo
        if: steps.profile.outputs.found == 'true'
        run: |
          go run ./cmd/pgoctl validate \
            --min-samples 1000 --min-score 0.3 \
            testdata/prometheus_cpu.pprof
          go run ./cmd/pgoctl merge \
            --strategy weighted --out /tmp/default.pgo \
            testdata/prometheus_cpu.pprof
          echo "Generated /tmp/default.pgo"

      - name: Checkout Prometheus
        if: steps.profile.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: prometheus/prometheus
          path: _prometheus
          fetch-depth: 1

      - name: Cache Go modules (Prometheus)
        if: steps.profile.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: prom-mod-${{ hashFiles('_prometheus/go.sum') }}
          restore-keys: prom-mod-

      - name: Install benchstat
        if: steps.profile.outputs.found == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download Prometheus dependencies
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        run: go mod download

      - name: Pre-compile test binaries (eliminate per-round build cost)
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        env:
          PGO_PROFILE: /tmp/default.pgo
          GOTOOLCHAIN: local
        shell: bash
        run: |
          mkdir -p /tmp/bench
          # Use -o with a directory so go test -c emits a properly-named binary.
          # Target ./tsdb (single package) — NOT ./tsdb/... which expands to
          # multiple packages and breaks with -o <single-file>.
          # Baseline binary — no PGO, compiled once
          go test -c -o /tmp/bench/baseline.test ./tsdb && echo "baseline binary ready"
          # PGO binary — compile once with profile, then reuse
          go test -c -pgo="$PGO_PROFILE" -o /tmp/bench/pgo.test ./tsdb && echo "pgo binary ready"

      - name: Run 10 interleaved benchmark rounds (baseline vs PGO)
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        env:
          GOGC: 200
        run: |
          export GOMAXPROCS=4
          echo "Go version: $(go version)"
          echo "Profile: /tmp/default.pgo"
          echo ""
          echo "Running 10 interleaved rounds: baseline THEN pgo on the same runner..."
          for i in $(seq 1 10); do
            echo "=== round $i/10 ==="
            # baseline arm — pre-compiled binary, no PGO
            /tmp/bench/baseline.test \
              -test.bench=. -test.benchtime=500ms -test.benchmem \
              -test.run=^$ -test.v=1 >> /tmp/bench/baseline.txt 2>/dev/null || true
            # pgo arm — pre-compiled binary with PGO profile baked in
            /tmp/bench/pgo.test \
              -test.bench=. -test.benchtime=500ms -test.benchmem \
              -test.run=^$ -test.v=1 >> /tmp/bench/pgo.txt 2>/dev/null || true
          done
          echo "Benchmark rounds complete."

      - name: benchstat comparison + pgoctl compare verdict
        if: steps.profile.outputs.found == 'true'
        id: report
        run: |
          BENCHSTAT_OUT=$(benchstat /tmp/bench/baseline.txt /tmp/bench/pgo.txt 2>&1 \
            || echo "(benchstat: no matching benchmarks or insufficient data)")

          COMPARE_OUT=$(go run ./cmd/pgoctl compare --json \
            testdata/prometheus_cpu.pprof testdata/prometheus_cpu.pprof 2>&1 || true)

          cat > /tmp/bench-report.md << 'REPORT'
          ## D4/D5 PGO Signal — Prometheus Benchmark

          | | |
          |---|---|
          | Target | `prometheus/prometheus ./tsdb` |
          | Profile | `testdata/prometheus_cpu.pprof` |
          | Rounds | 10 interleaved pairs, same runner |
          | Toolchain | pinned `GOTOOLCHAIN=local` |
          | Method | `go test -c` once per arm, then run .test binary |

          ### benchstat (geomean + p-value)

          ```
          REPORT
          echo "$BENCHSTAT_OUT" >> /tmp/bench-report.md
          cat >> /tmp/bench-report.md << 'REPORT2'
          ```

          > Threshold: ≥3% geomean improvement (p < 0.05) to promote.
          > p-value interpretation: p < 0.05 = statistically significant.

          ### pgoctl compare verdict (pprof-diff mode)

          ```
          REPORT2
          echo "$COMPARE_OUT" >> /tmp/bench-report.md
          printf '```\n' >> /tmp/bench-report.md

          cat /tmp/bench-report.md >> $GITHUB_STEP_SUMMARY

      - name: Post sticky PR comment
        if: >
          steps.profile.outputs.found == 'true' &&
          github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pgo-bench
          path: /tmp/bench-report.md