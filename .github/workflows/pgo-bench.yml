name: PGO Benchmark
# D4/D5 signal: proves PGO before/after on Prometheus.
# Uses 10 interleaved rounds on the SAME runner to eliminate cross-job variance.
# Requires testdata/prometheus_cpu.pprof (from profile-collect workflow).
# Posts benchstat p-value output to job summary and sticky PR comment.
# Benchmarked packages are derived from pgoctl validate --json package_shares, not guessed.
# Current profile (2026-08-10): tsdb 15.92%, promql 15.17%, storage 6.38%,
#   tsdb/chunkenc 4.59%, model/labels 3.28%, util/annotations 0.74% (no benchmarks).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'testdata/*.pprof'
      - '.github/workflows/pgo-bench.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check for pprof profile
        id: profile
        run: |
          if [ -f testdata/prometheus_cpu.pprof ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Profile found: testdata/prometheus_cpu.pprof"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::testdata/prometheus_cpu.pprof not found — run profile-collect workflow first."
          fi

      - name: Skip if no profile
        if: steps.profile.outputs.found != 'true'
        run: |
          echo "## PGO Benchmark: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`testdata/prometheus_cpu.pprof\` present. Run the *Profile Collect* workflow, " \
               "then commit the artifact to \`testdata/\` and re-trigger." >> "$GITHUB_STEP_SUMMARY"

      - name: Build pgoctl binary
        if: steps.profile.outputs.found == 'true'
        run: |
          go build -o /tmp/pgoctl ./cmd/pgoctl

      - name: Validate + generate default.pgo
        if: steps.profile.outputs.found == 'true'
        run: |
          /tmp/pgoctl validate \
            --min-samples 1000 --min-score 0.3 \
            testdata/prometheus_cpu.pprof
          /tmp/pgoctl merge \
            --strategy weighted --out /tmp/default.pgo \
            testdata/prometheus_cpu.pprof
          echo "Generated /tmp/default.pgo"
          echo "=== Package shares (from pgoctl validate --json) ==="
          /tmp/pgoctl validate \
            --min-samples 1000 --min-score 0.3 \
            --min-package-share "github.com/prometheus/prometheus/tsdb:0.1" \
            --min-package-share "github.com/prometheus/prometheus/promql:0.1" \
            --min-package-share "github.com/prometheus/prometheus/storage:0.1" \
            --min-package-share "github.com/prometheus/prometheus/tsdb/chunkenc:0.1" \
            --min-package-share "github.com/prometheus/prometheus/model/labels:0.1" \
            --min-package-share "github.com/prometheus/prometheus/util/annotations:0.1" \
            --json \
            testdata/prometheus_cpu.pprof > /tmp/validate-shares.json 2>&1 || true
          cat /tmp/validate-shares.json

      - name: Checkout Prometheus
        if: steps.profile.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          repository: prometheus/prometheus
          path: _prometheus
          fetch-depth: 1

      - name: Cache Go modules (Prometheus)
        if: steps.profile.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: prom-mod-${{ hashFiles('_prometheus/go.sum') }}
          restore-keys: prom-mod-

      - name: Install benchstat
        if: steps.profile.outputs.found == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download Prometheus dependencies
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        run: go mod download

      - name: Pre-compile test binaries per hot package
        if: steps.profile.outputs.found == 'true'
        working-directory: _prometheus
        env:
          PGO_PROFILE: /tmp/default.pgo
          GOTOOLCHAIN: local
        run: |
          mkdir -p /tmp/bench
          # Five packages with benchmarks, ordered by profile flat CPU share.
          # tsdb:15.92%  promql:15.17%  storage:6.38%  tsdb/chunkenc:4.59%  model/labels:3.28%
          # Each package gets a baseline binary (no PGO) and a PGO binary compiled once.
          declare -A PKG_PATH
          PKG_PATH[tsdb]="./tsdb"
          PKG_PATH[promql]="./promql"
          PKG_PATH[storage]="./storage"
          PKG_PATH[chunkenc]="./tsdb/chunkenc"
          PKG_PATH[labels]="./model/labels"
          for name in tsdb promql storage chunkenc labels; do
            path="${PKG_PATH[$name]}"
            echo "[$(date -u +%H:%M:%S)] compiling ${name} (baseline) from ${path}"
            go test -c -o /tmp/bench/${name}-baseline.test "${path}"
            echo "[$(date -u +%H:%M:%S)] compiling ${name} (pgo) from ${path}"
            go test -c -pgo="$PGO_PROFILE" -o /tmp/bench/${name}-pgo.test "${path}"
          done
          echo "[$(date -u +%H:%M:%S)] all test binaries compiled"

      - name: Verify + time curated benchmarks (fail-fast probe)
        if: steps.profile.outputs.found == 'true'
        run: |
          declare -A BENCH
          BENCH[tsdb]='^Benchmark(HeadStripeSeriesCreate|HeadStripeSeriesCreateParallel|MergedStringIter)$'
          BENCH[promql]='^BenchmarkParser$'
          BENCH[storage]='^Benchmark(BufferedSeriesIterator|MemoizedSeriesIterator|NoMergeSeriesSet_100_100)$'
          BENCH[chunkenc]='.'
          BENCH[labels]='.'
          for name in tsdb promql storage chunkenc labels; do
            s=$SECONDS
            count=$(timeout 60s /tmp/bench/${name}-baseline.test \
              -test.bench="${BENCH[$name]}" -test.benchtime=50ms -test.run='^$' 2>/dev/null \
              | grep -c '^Benchmark' || echo 0)
            echo "${name}: ${count} benchmarks matched, probe $((SECONDS-s))s"
            if [ "$count" -eq 0 ]; then
              echo "::error::${name}: 0 benchmarks matched '${BENCH[$name]}' — fix the pattern before running 10 rounds"
              exit 1
            fi
          done

      - name: Run 10 interleaved benchmark rounds (baseline vs PGO, all hot packages)
        if: steps.profile.outputs.found == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          export GOMAXPROCS=2
          BENCHTIME=200ms
          # Safety net: if a benchmark's setup hangs (no stdout, no timeout by default),
          # the outer timeout kills it and rc=124 surfaces as a CI warning.
          BINTIMEOUT=90s

          echo "Go version: $(go version)"
          echo "Profile: /tmp/default.pgo"

          declare -A BENCH
          BENCH[tsdb]='^Benchmark(HeadStripeSeriesCreate|HeadStripeSeriesCreateParallel|MergedStringIter)$'
          BENCH[promql]='^BenchmarkParser$'
          BENCH[storage]='^Benchmark(BufferedSeriesIterator|MemoizedSeriesIterator|NoMergeSeriesSet_100_100)$'
          BENCH[chunkenc]='.'
          BENCH[labels]='.'

          echo "Running 10 interleaved rounds across 5 packages (GOMAXPROCS=${GOMAXPROCS}, benchtime=${BENCHTIME})..."
          overall=$SECONDS
          for i in $(seq 1 10); do
            r=$SECONDS
            echo ""
            echo "================= round $i/10 ================="
            for name in tsdb promql storage chunkenc labels; do
              sel="${BENCH[$name]}"

              echo "--- [$(date -u +%H:%M:%S)] round $i • ${name} • baseline • bench=${sel} ---"
              timeout "${BINTIMEOUT}" /tmp/bench/${name}-baseline.test \
                -test.bench="${sel}" -test.benchtime=${BENCHTIME} -test.benchmem \
                -test.timeout="${BINTIMEOUT}" -test.run=^$ \
                2>&1 | tee -a /tmp/bench/${name}-baseline.txt || \
                echo "    ::warning::${name}/baseline may have timed out"

              echo "--- [$(date -u +%H:%M:%S)] round $i • ${name} • pgo • bench=${sel} ---"
              timeout "${BINTIMEOUT}" /tmp/bench/${name}-pgo.test \
                -test.bench="${sel}" -test.benchtime=${BENCHTIME} -test.benchmem \
                -test.timeout="${BINTIMEOUT}" -test.run=^$ \
                2>&1 | tee -a /tmp/bench/${name}-pgo.txt || \
                echo "    ::warning::${name}/pgo may have timed out"
            done
            echo "--- round $i done in $((SECONDS - r))s (total $((SECONDS - overall))s) ---"
          done

          echo ""
          echo "[$(date -u +%H:%M:%S)] all rounds complete in $((SECONDS - overall))s"

      - name: benchstat + summary
        if: steps.profile.outputs.found == 'true'
        run: |
          : > /tmp/bench-report.md
          : > /tmp/bench-summary.md

          # Build per-package benchstat output first, extract geomean lines for top table
          for name in tsdb promql storage chunkenc labels; do
            benchstat /tmp/bench/${name}-baseline.txt /tmp/bench/${name}-pgo.txt \
              > /tmp/bench/${name}-stat.txt 2>&1 || true
          done

          # Top-level geomean summary table (always visible)
          {
            echo "## PGO Benchmark — baseline vs PGO"
            echo ""
            echo "_10 interleaved rounds, GOMAXPROCS=2, benchtime=200ms. Signal: ≥2–3% geomean at p<0.05._"
            echo ""
            echo "| Package | geomean Δ | p-value |"
            echo "|---------|-----------|---------|"
            for name in tsdb promql storage chunkenc labels; do
              geomean=$(grep -m1 "geomean" /tmp/bench/${name}-stat.txt 2>/dev/null || echo "")
              if [ -n "$geomean" ]; then
                delta=$(echo "$geomean" | awk '{print $3}' 2>/dev/null || echo "—")
                pval=$(echo "$geomean"  | awk '{print $NF}' 2>/dev/null || echo "—")
              else
                delta="—"; pval="—"
              fi
              echo "| \`${name}\` | ${delta} | ${pval} |"
            done
            echo ""
          } >> /tmp/bench-report.md

          # Per-package collapsible section (single <details> for all packages)
          {
            echo "<details>"
            echo "<summary>📦 Package-level breakdown (5 packages)</summary>"
            echo ""
            for name in tsdb promql storage chunkenc labels; do
              echo "#### ${name}"
              echo ""
              echo '```'
              cat /tmp/bench/${name}-stat.txt
              echo '```'
              echo ""
            done
            echo "</details>"
            echo ""
          } >> /tmp/bench-report.md

          # Job summary gets the full flat output (not PR comment, no collapsible needed)
          {
            echo "## PGO Benchmark — baseline vs PGO"
            echo "_10 interleaved rounds, GOMAXPROCS=2, benchtime=200ms._"
            echo ""
            for name in tsdb promql storage chunkenc labels; do
              echo "### ${name}"
              echo '```'
              cat /tmp/bench/${name}-stat.txt
              echo '```'
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "----- rendered report -----"
          cat /tmp/bench-report.md

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && steps.profile.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pgo-bench
          path: /tmp/bench-report.md
