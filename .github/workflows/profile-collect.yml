name: Profile Collect
# Spins up Prometheus in kind, drives load, captures a 30s CPU pprof,
# validates it with pgoctl, and uploads as a workflow artifact.
# Run manually (workflow_dispatch) to produce testdata/prometheus_cpu.pprof.
#
# NOTE: workflow_dispatch only fires from the DEFAULT branch, so this
# workflow goes live for dispatch only after it is merged to main.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Profile duration in seconds'
        required: false
        default: '30'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pgoctl-dev

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Prometheus exposes /debug/pprof BY DEFAULT (web.enable-pprof=true),
      # so no additionalArgs are needed. We also disable grafana and
      # alertmanager: the profile is captured from the prometheus server
      # itself, and trimming the stack reduces OOM risk on the 2-core/7GB
      # Actions runner (the previous run died because prometheus was killed
      # by resource pressure right after `helm --wait` returned).
      - name: Deploy Prometheus (pprof on by default)
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update
          kubectl create namespace monitoring
          helm upgrade --install prometheus \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=false \
            --set alertmanager.enabled=false \
            --wait --timeout 5m

      # Real readiness gate before port-forward: `helm --wait` only proves
      # the deployment was Ready at install time, not that the prometheus
      # container is still serving when we connect. Wait for the operator-
      # managed statefulset pod (selector matches the chart's pod labels).
      - name: Wait for Prometheus pod Ready
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            -n monitoring \
            -l app.kubernetes.io/name=prometheus \
            --timeout=300s

      - name: Dump diagnostics (only if readiness wait failed)
        if: failure()
        run: |
          echo "::group::All monitoring pods"
          kubectl get pods -n monitoring -o wide || true
          echo "::endgroup::"
          echo "::group::Prometheus pod describe"
          kubectl describe pod -n monitoring \
            -l app.kubernetes.io/name=prometheus || true
          echo "::endgroup::"
          echo "::group::Prometheus pod logs"
          kubectl logs -n monitoring \
            -l app.kubernetes.io/name=prometheus --tail=200 || true
          echo "::endgroup::"

      - name: Port-forward Prometheus
        run: |
          kubectl port-forward -n monitoring \
            svc/prometheus-kube-prometheus-prometheus 9090:9090 &
          # wait for port-forward to be ready (retry transient conn refused)
          timeout 60 bash -c \
            'until curl -sf --retry 5 --retry-connrefused http://localhost:9090/-/ready; do sleep 2; done'

      - name: Drive load (60s)
        run: |
          go install github.com/rakyll/hey@latest
          hey -z 60s -c 20 \
            'http://localhost:9090/api/v1/query?query=up' || true

      - name: Collect CPU profile
        run: |
          mkdir -p testdata
          go run ./cmd/baseline \
            --url http://localhost:9090/debug/pprof/profile \
            --seconds ${{ github.event.inputs.duration || 30 }} \
            --out testdata/prometheus_cpu.pprof

      - name: Validate profile with pgoctl
        run: |
          go run ./cmd/pgoctl validate \
            --min-samples 1000 \
            --min-score 0.3 \
            --json \
            testdata/prometheus_cpu.pprof

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-pprof-${{ github.run_id }}
          path: testdata/prometheus_cpu.pprof
          retention-days: 30

      - name: Summary
        run: |
          SIZE=$(wc -c < testdata/prometheus_cpu.pprof)
          echo "## Profile Collect
          - Profile: \`testdata/prometheus_cpu.pprof\`
          - Size: ${SIZE} bytes
          - Duration: ${{ github.event.inputs.duration || 30 }}s

          Download artifact **prometheus-pprof-${{ github.run_id }}** and commit to \`testdata/\` to enable pgo-bench." \
          >> $GITHUB_STEP_SUMMARY
